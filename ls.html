<!DOCTYPE html>
<html>
<head>
    <title>LS</title>
    <style>
        body {
            font-family: sans-serif;
        }
        .folder {
            font-weight: bold;
            cursor: pointer;
        }
        .children {
            margin-left: 20px;
        }
        .file {
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <h1>Files</h1>
    <div id="files"></div>
<script>
    const OWNER = "MatriCYS1";
    const REPO = "vercelarrasstatus";
    const VERCEL_URL = "https://iostatus.vercel.app";

    function getType(name) {
        name = name.toLowerCase();

        if (/\.(png|jpg|jpeg|gif|webp|svg)$/.test(name)) return "image";
        if (/\.(mp3|wav|ogg|m4a|flac)$/.test(name)) return "audio";
        if (name.endsWith(".html")) return "html";

        return "file";
    }

    function getVercelUrl(path) {
        return `${VERCEL_URL}/${path}`;
    }

    async function loadFolder(path = "", container) {
        const response = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`
        );

        const items = await response.json();
        const div = document.createElement("div");

        for (const item of items) {

            if (item.type === "dir") {

                const folder = document.createElement("div");
                folder.className = "folder";
                folder.textContent = "📁 " + item.name;

                const children = document.createElement("div");
                children.className = "children";
                children.style.display = "none";

                folder.onclick = async () => {
                    if (!children.dataset.loaded) {
                        children.dataset.loaded = "true";
                        await loadFolder(item.path, children);
                    }

                    children.style.display =
                        children.style.display === "none"
                        ? "block"
                        : "none";
                };

                div.appendChild(folder);
                div.appendChild(children);

            } else {

                const fileUrl = getVercelUrl(item.path);
                const type = getType(item.name);

                const fileDiv = document.createElement("div");
                fileDiv.className = "file";

                if (type === "image") {

                    fileDiv.innerHTML = `
                        🖼️
                        <a href="${fileUrl}" target="_blank">
                            ${item.name}
                        </a>
                        <br>
                        <img
                            src="${fileUrl}"
                            style="max-width:200px;max-height:200px;"
                            loading="lazy">
                    `;

                } else if (type === "audio") {

                    fileDiv.innerHTML = `
                        🎵
                        <a href="${fileUrl}" target="_blank">
                            ${item.name}
                        </a>
                        <br>
                        <audio controls src="${fileUrl}"></audio>
                    `;

                } else if (type === "html") {

                    fileDiv.innerHTML = `
                        🌐
                        <a href="${fileUrl}" target="_blank">
                            ${item.name}
                        </a>
                    `;

                } else {

                    fileDiv.innerHTML = `
                        📄
                        <a href="${fileUrl}" target="_blank">
                            ${item.name}
                        </a>
                    `;

                }

                div.appendChild(fileDiv);
            }
        }

        container.appendChild(div);
    }

    loadFolder("", document.getElementById("files"));
</script>
</body>
</html>
