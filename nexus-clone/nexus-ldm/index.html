<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <script src="index.js" defer></script>
    <style>
      #flex {
        display: flex;
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        justify-content: center;
        align-items: center;
        pointer-events: none; /* Let clicks pass through to the canvas */
      }
      input {
        z-index: 1;
        position: relative;
        background-color: white;
        height: 22px;
        width: 300px;
        font-size: 14px;
        border-radius: 11px;
        border: 2px solid #484848;
        outline: none;
        transform: translateY(-7vh);
        font-family: "Segoe UI", Arial, sans-serif;
        padding: 0 10px;
        pointer-events: auto; /* Re-enable clicks for typing */
      }
    </style>
</head>
<body>
    <canvas></canvas>
    <div id="flex">
        <input type="text" id="chatInput" hidden />
    </div>
</body>
</html>
